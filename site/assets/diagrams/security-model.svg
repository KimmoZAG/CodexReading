<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="system-ui, sans-serif">
  <rect width="800" height="500" fill="#FFFFFF"/>

  <text x="30" y="28" font-size="20" font-weight="700" fill="#111827">Codex 安全模型：四层防御</text>

  <!-- ① 用户审批层 -->
  <rect x="30" y="40" width="560" height="420" rx="20" fill="#FEF3C7" stroke="#4F46E5" stroke-width="2" stroke-dasharray="10 6"/>
  <text x="48" y="70" font-size="15" font-weight="700" fill="#312E81">① 用户审批层 User Approval</text>
  <text x="48" y="452" font-size="12" fill="#92400E">用户确认危险操作</text>

  <!-- ② 协议隔离层 -->
  <rect x="80" y="90" width="460" height="320" rx="16" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="98" y="120" font-size="15" font-weight="700" fill="#312E81">② 协议隔离层 Protocol Boundary</text>
  <text x="98" y="398" font-size="12" fill="#3730A3">Op / Event 序列化通信</text>

  <!-- ③ 进程沙箱层 -->
  <rect x="130" y="140" width="360" height="220" rx="14" fill="#ECFDF5" stroke="#4F46E5" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="148" y="170" font-size="15" font-weight="700" fill="#312E81">③ 进程沙箱层 Process Sandbox</text>
  <text x="148" y="348" font-size="12" fill="#065F46">exec-server 独立进程</text>

  <!-- ④ 工具权限层 -->
  <rect x="180" y="190" width="260" height="120" rx="12" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2.5"/>
  <text x="310" y="234" text-anchor="middle" font-size="15" font-weight="700" fill="#312E81">④ 工具权限层 Tool Policy</text>
  <text x="310" y="260" text-anchor="middle" font-size="12" fill="#4F46E5">amend / allowlist / denylist</text>

  <!-- 右侧图例 -->
  <text x="630" y="70" font-size="15" font-weight="700" fill="#111827">图例 Legend</text>

  <rect x="630" y="92" width="18" height="18" rx="3" fill="#FEF3C7" stroke="#4F46E5" stroke-width="1.5" stroke-dasharray="4 2"/>
  <text x="656" y="100" font-size="12" font-weight="600" fill="#312E81">① 用户审批层</text>
  <text x="656" y="116" font-size="11" fill="#6B7280">用户确认危险操作</text>

  <rect x="630" y="142" width="18" height="18" rx="3" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5" stroke-dasharray="4 2"/>
  <text x="656" y="150" font-size="12" font-weight="600" fill="#312E81">② 协议隔离层</text>
  <text x="656" y="166" font-size="11" fill="#6B7280">Op / Event 序列化通信</text>

  <rect x="630" y="192" width="18" height="18" rx="3" fill="#ECFDF5" stroke="#4F46E5" stroke-width="1.5" stroke-dasharray="4 2"/>
  <text x="656" y="200" font-size="12" font-weight="600" fill="#312E81">③ 进程沙箱层</text>
  <text x="656" y="216" font-size="11" fill="#6B7280">exec-server 独立进程</text>

  <rect x="630" y="242" width="18" height="18" rx="3" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2"/>
  <text x="656" y="250" font-size="12" font-weight="600" fill="#312E81">④ 工具权限层</text>
  <text x="656" y="266" font-size="11" fill="#6B7280">amend / allowlist / denylist</text>

  <text x="630" y="306" font-size="11" fill="#6B7280">虚线框 = 隔离边界</text>
  <text x="630" y="324" font-size="11" fill="#6B7280">实线框 = 策略内核</text>
</svg>
