<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 460" font-family="system-ui, -apple-system, 'Segoe UI', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'WenQuanYi Micro Hei', sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#4F46E5"/>
    </marker>
  </defs>
  <rect width="820" height="460" fill="#FFFFFF"/>
  <text x="40" y="40" font-size="22" font-weight="700" fill="#111827">TUI 是事件的视图</text>
  <text x="40" y="64" font-size="13" fill="#6B7280">state = reduce(Events)：事件流入，归约出状态，再渲染成界面</text>

  <!-- EventMsg -->
  <rect x="60" y="200" width="200" height="70" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
  <text x="160" y="232" text-anchor="middle" font-size="16" font-weight="600" fill="#312E81">EventMsg 流入</text>
  <text x="160" y="254" text-anchor="middle" font-size="12" fill="#4F46E5">事件流</text>

  <!-- reduce -->
  <rect x="320" y="190" width="220" height="90" rx="12" fill="#EEF2FF" stroke="#6366F1" stroke-width="2"/>
  <text x="430" y="228" text-anchor="middle" font-size="17" font-weight="600" fill="#312E81">reduce(Events)</text>
  <text x="430" y="252" text-anchor="middle" font-size="12" fill="#4F46E5">累积状态</text>

  <!-- state -->
  <rect x="600" y="200" width="180" height="70" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
  <text x="690" y="232" text-anchor="middle" font-size="16" font-weight="600" fill="#312E81">State 状态</text>
  <text x="690" y="254" text-anchor="middle" font-size="12" fill="#4F46E5">当前视图数据</text>

  <!-- 渲染 -->
  <rect x="600" y="340" width="180" height="70" rx="12" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="2"/>
  <text x="690" y="372" text-anchor="middle" font-size="16" font-weight="600" fill="#374151">渲染 Render</text>
  <text x="690" y="394" text-anchor="middle" font-size="12" fill="#6B7280">TUI 视图</text>

  <!-- Arrows -->
  <line x1="260" y1="235" x2="318" y2="235" stroke="#4F46E5" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="540" y1="235" x2="598" y2="235" stroke="#4F46E5" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="690" y1="270" x2="690" y2="338" stroke="#4F46E5" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="560" y="320" font-size="11" fill="#6B7280">state = reduce(events)</text>
</svg>
