<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="system-ui, sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="10" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#4F46E5"/>
    </marker>
  </defs>
  <rect width="800" height="480" fill="#FFFFFF"/>
  <text x="40" y="40" font-size="22" font-weight="700" fill="#111827">Codex 整体架构 · 万米视角</text>
  <text x="40" y="64" font-size="13" fill="#6B7280">CLI / App-Server / Codex-Core / Exec-Server 四者关系</text>

  <!-- CLI -->
  <rect x="300" y="100" width="200" height="70" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
  <text x="400" y="132" text-anchor="middle" font-size="18" font-weight="600" fill="#312E81">CLI 命令行</text>
  <text x="400" y="154" text-anchor="middle" font-size="13" fill="#4F46E5">薄壳 · Thin Shell</text>

  <!-- App Server container -->
  <rect x="190" y="220" width="420" height="210" rx="16" fill="#F9FAFB" stroke="#4F46E5" stroke-width="2"/>
  <text x="400" y="245" text-anchor="middle" font-size="16" font-weight="600" fill="#312E81">App Server</text>
  <text x="400" y="263" text-anchor="middle" font-size="12" fill="#4F46E5">常驻 · Always-on</text>

  <!-- Codex Core inside -->
  <rect x="250" y="290" width="300" height="110" rx="12" fill="#EEF2FF" stroke="#6366F1" stroke-width="2"/>
  <text x="400" y="335" text-anchor="middle" font-size="18" font-weight="600" fill="#312E81">Codex Core</text>
  <text x="400" y="360" text-anchor="middle" font-size="13" fill="#4F46E5">大脑 · Brain</text>

  <!-- Trust boundary around exec -->
  <rect x="640" y="220" width="160" height="210" rx="16" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="720" y="246" text-anchor="middle" font-size="12" fill="#6B7280">信任边界</text>

  <!-- Exec Server inside -->
  <rect x="660" y="290" width="120" height="110" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
  <text x="720" y="335" text-anchor="middle" font-size="16" font-weight="600" fill="#312E81">Exec Server</text>
  <text x="720" y="358" text-anchor="middle" font-size="12" fill="#4F46E5">沙箱 · Sandbox</text>

  <!-- Arrows -->
  <line x1="400" y1="170" x2="400" y2="218" stroke="#4F46E5" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="610" y1="345" x2="658" y2="345" stroke="#4F46E5" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="624" y="335" text-anchor="middle" font-size="11" fill="#6B7280">RPC</text>
</svg>
