<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="system-ui, -apple-system, 'Segoe UI', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'WenQuanYi Micro Hei', sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="10" refY="3" orient="auto-start-reverse" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#4F46E5"/>
    </marker>
  </defs>
  <rect width="800" height="480" fill="#FFFFFF"/>
  <text x="40" y="42" font-size="22" font-weight="700" fill="#111827">Codex 整体架构 · 万米视角</text>
  <text x="40" y="66" font-size="13" fill="#6B7280">CLI / App-Server / Codex-Core / Exec-Server 四者关系</text>

  <!-- CLI (thin shell) -->
  <rect x="130" y="85" width="200" height="66" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
  <text x="230" y="116" text-anchor="middle" font-size="18" font-weight="600" fill="#312E81">CLI 命令行</text>
  <text x="230" y="138" text-anchor="middle" font-size="12" fill="#4F46E5">薄壳 · Thin Shell</text>

  <!-- App Server container (hosts Core) -->
  <rect x="85" y="195" width="290" height="235" rx="16" fill="#F9FAFB" stroke="#4F46E5" stroke-width="2"/>
  <text x="230" y="222" text-anchor="middle" font-size="16" font-weight="600" fill="#312E81">App Server</text>
  <text x="230" y="242" text-anchor="middle" font-size="12" fill="#4F46E5">常驻 · Always-on</text>

  <!-- Codex Core (inner box, clearly nested) -->
  <rect x="125" y="262" width="210" height="140" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
  <text x="230" y="305" text-anchor="middle" font-size="18" font-weight="600" fill="#312E81">Codex Core</text>
  <text x="230" y="328" text-anchor="middle" font-size="13" fill="#4F46E5">大脑 · Brain</text>
  <text x="230" y="352" text-anchor="middle" font-size="11" fill="#6B7280">常驻于此 · Hosted by App Server</text>

  <!-- Trust Boundary (independent container, clear slate dashed stroke) -->
  <rect x="435" y="195" width="280" height="235" rx="16" fill="#F3F4F6" stroke="#475569" stroke-width="2.5" stroke-dasharray="8 6"/>
  <text x="575" y="222" text-anchor="middle" font-size="15" font-weight="600" fill="#475569">信任边界 / Trust Boundary</text>

  <!-- Exec Server (sandbox, inside trust boundary) -->
  <rect x="475" y="262" width="200" height="140" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
  <text x="575" y="318" text-anchor="middle" font-size="16" font-weight="600" fill="#312E81">Exec Server</text>
  <text x="575" y="340" text-anchor="middle" font-size="12" fill="#4F46E5">沙箱 · Sandbox</text>

  <!-- Arrows -->
  <!-- CLI -> App Server: ends exactly on App Server top edge (y=195) -->
  <line x1="230" y1="151" x2="230" y2="195" stroke="#4F46E5" stroke-width="2.5" marker-end="url(#a)"/>
  <!-- RPC: entirely in the gap between container edges (375 -> 435), never enters Core -->
  <line x1="375" y1="330" x2="435" y2="330" stroke="#4F46E5" stroke-width="2.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="405" y="320" text-anchor="middle" font-size="11" fill="#6B7280">RPC</text>
</svg>
