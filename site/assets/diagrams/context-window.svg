<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="system-ui, sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#4F46E5"/>
    </marker>
  </defs>
  <rect width="800" height="460" fill="#FFFFFF"/>
  <text x="40" y="40" font-size="22" font-weight="700" fill="#111827">上下文窗口的 token 预算</text>
  <text x="40" y="64" font-size="13" fill="#6B7280">一次采样前，token 在 system / history / tools / output 间的分配（比例示意）</text>

  <!-- window frame -->
  <rect x="54" y="150" width="732" height="104" rx="14" fill="none" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="60" y="142" font-size="12" fill="#6B7280">上下文窗口 Context Window</text>

  <!-- segments -->
  <rect x="60"  y="164" width="127" height="76" rx="8" fill="#4F46E5"/>
  <rect x="191" y="164" width="333" height="76" rx="8" fill="#6366F1"/>
  <rect x="528" y="164" width="106" height="76" rx="8" fill="#818CF8"/>
  <rect x="638" y="164" width="142" height="76" rx="8" fill="#A5B4FC"/>

  <!-- segment labels -->
  <text x="123" y="206" text-anchor="middle" font-size="14" font-weight="600" fill="#FFFFFF">System</text>
  <text x="123" y="226" text-anchor="middle" font-size="11" fill="#EEF2FF">~18%</text>

  <text x="357" y="206" text-anchor="middle" font-size="14" font-weight="600" fill="#FFFFFF">History</text>
  <text x="357" y="226" text-anchor="middle" font-size="11" fill="#EEF2FF">对话历史 ~47%</text>

  <text x="581" y="206" text-anchor="middle" font-size="14" font-weight="600" fill="#FFFFFF">Tools</text>
  <text x="581" y="226" text-anchor="middle" font-size="11" fill="#EEF2FF">~15%</text>

  <text x="709" y="206" text-anchor="middle" font-size="14" font-weight="600" fill="#312E81">Output</text>
  <text x="709" y="226" text-anchor="middle" font-size="11" fill="#312E81">~20%</text>

  <!-- caption -->
  <text x="60" y="320" font-size="14" font-weight="600" fill="#374151">压缩前：对话历史随轮次增长，逼近窗口上限</text>
  <text x="60" y="348" font-size="13" fill="#6B7280">超限时 run_pre_sampling_compact（12.2）摘要旧历史，把 token 压回预算内；输出预算独立于输入侧。</text>
</svg>
