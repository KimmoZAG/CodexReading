<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 620" font-family="system-ui, -apple-system, 'Segoe UI', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'WenQuanYi Micro Hei', sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#4F46E5"/>
    </marker>
  </defs>
  <rect width="820" height="620" fill="#FFFFFF"/>
  <text x="40" y="40" font-size="22" font-weight="700" fill="#111827">沙箱闸门</text>
  <text x="40" y="64" font-size="13" fill="#6B7280">模型指令经策略判定，需批准者进入审批流程，全部在沙箱内执行后回流</text>

  <!-- 模型指令 -->
  <rect x="330" y="90" width="280" height="64" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
  <text x="470" y="128" text-anchor="middle" font-size="17" font-weight="600" fill="#312E81">模型指令 Instruction</text>

  <!-- 策略判定 -->
  <rect x="330" y="200" width="280" height="72" rx="12" fill="#EEF2FF" stroke="#6366F1" stroke-width="2"/>
  <text x="470" y="238" text-anchor="middle" font-size="17" font-weight="600" fill="#312E81">策略判定 Policy</text>
  <text x="470" y="260" text-anchor="middle" font-size="12" fill="#4F46E5">是否允许执行</text>

  <!-- ExecApprovalRequest -->
  <rect x="110" y="330" width="270" height="70" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
  <text x="245" y="368" text-anchor="middle" font-size="16" font-weight="600" fill="#312E81">ExecApprovalRequest</text>
  <text x="245" y="390" text-anchor="middle" font-size="12" fill="#4F46E5">审批请求</text>

  <!-- 沙箱 -->
  <rect x="500" y="310" width="300" height="250" rx="16" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="650" y="336" text-anchor="middle" font-size="12" fill="#6B7280">沙箱 · 信任边界</text>
  <rect x="540" y="360" width="220" height="100" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
  <text x="650" y="402" text-anchor="middle" font-size="16" font-weight="600" fill="#312E81">Exec-Server</text>
  <text x="650" y="426" text-anchor="middle" font-size="12" fill="#4F46E5">沙箱内执行</text>

  <!-- 输出回流 -->
  <rect x="540" y="500" width="220" height="56" rx="12" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2"/>
  <text x="650" y="534" text-anchor="middle" font-size="16" font-weight="600" fill="#374151">输出回流 Output</text>

  <!-- Arrows -->
  <line x1="470" y1="154" x2="470" y2="198" stroke="#4F46E5" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="400" y1="272" x2="280" y2="328" stroke="#4F46E5" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="318" y="300" font-size="11" fill="#6B7280">需批准</text>
  <line x1="560" y1="236" x2="620" y2="308" stroke="#4F46E5" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="600" y="270" font-size="11" fill="#6B7280">无需批准</text>
  <line x1="380" y1="365" x2="538" y2="400" stroke="#4F46E5" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="452" y="378" font-size="11" fill="#6B7280">用户批准后</text>
  <line x1="650" y1="460" x2="650" y2="498" stroke="#4F46E5" stroke-width="2.5" marker-end="url(#a)"/>
</svg>
