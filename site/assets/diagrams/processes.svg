<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 540" font-family="system-ui, -apple-system, 'Segoe UI', 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'WenQuanYi Micro Hei', sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#4F46E5"/>
    </marker>
  </defs>
  <rect width="820" height="540" fill="#FFFFFF"/>
  <text x="40" y="40" font-size="22" font-weight="700" fill="#111827">三进程模型与信任边界</text>
  <text x="40" y="64" font-size="13" fill="#6B7280">CLI / App-Server / Exec-Server 为三个进程，Codex-Core 常驻于 App-Server 内</text>

  <!-- CLI -->
  <rect x="310" y="92" width="200" height="72" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
  <text x="410" y="124" text-anchor="middle" font-size="18" font-weight="600" fill="#312E81">CLI 命令行</text>
  <text x="410" y="146" text-anchor="middle" font-size="13" fill="#4F46E5">薄壳 · Thin Shell</text>

  <!-- App Server container (明显更大的圆角容器) -->
  <rect x="40" y="200" width="320" height="280" rx="18" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2.5"/>
  <text x="200" y="232" text-anchor="middle" font-size="18" font-weight="600" fill="#312E81">App Server</text>
  <text x="200" y="254" text-anchor="middle" font-size="13" fill="#4F46E5">常驻 · Always-on</text>

  <!-- Codex Core 嵌套于 App Server 内部 -->
  <rect x="72" y="286" width="256" height="168" rx="12" fill="#FFFFFF" stroke="#6366F1" stroke-width="2"/>
  <text x="200" y="338" text-anchor="middle" font-size="17" font-weight="600" fill="#312E81">Codex Core</text>
  <text x="200" y="366" text-anchor="middle" font-size="13" fill="#4F46E5">大脑 · Brain</text>
  <text x="200" y="392" text-anchor="middle" font-size="12" fill="#6B7280">Core 常驻于 App Server 内</text>

  <!-- 信任边界容器 (清晰 slate 虚线，宽度≥2) -->
  <rect x="470" y="170" width="310" height="320" rx="18" fill="#F9FAFB" stroke="#475569" stroke-width="2.5" stroke-dasharray="9 6"/>
  <text x="625" y="200" text-anchor="middle" font-size="14" font-weight="600" fill="#475569">信任边界 · Trust Boundary</text>

  <!-- Exec Server 位于信任边界内 -->
  <rect x="520" y="300" width="210" height="150" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
  <text x="625" y="360" text-anchor="middle" font-size="17" font-weight="600" fill="#312E81">Exec Server</text>
  <text x="625" y="386" text-anchor="middle" font-size="13" fill="#4F46E5">沙箱 · Sandbox</text>

  <!-- 箭头 -->
  <!-- CLI → App Server（终点落在 App Server 容器边缘） -->
  <line x1="410" y1="164" x2="410" y2="198" stroke="#4F46E5" stroke-width="2.5" marker-end="url(#a)"/>
  <!-- App Server →(RPC)→ 信任边界（从 App Server 边缘出发，落在信任边界边缘） -->
  <line x1="362" y1="350" x2="468" y2="350" stroke="#4F46E5" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="415" y="340" text-anchor="middle" font-size="12" fill="#6B7280">RPC</text>
</svg>
