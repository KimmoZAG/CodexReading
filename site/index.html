  <!-- 关键 JS：主 CDN 失败则同步回退到 unpkg（document.write 保证加载顺序，避免白屏） -->

  <script>window.marked||document.write('<script src="https://unpkg.com/marked/marked.min.js"><\/script>')</script>

  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <script>window.mermaid||document.write('<script src="https://unpkg.com/mermaid@10/dist/mermaid.min.js"><\/script>')</script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script>window.hljs||document.write('<script src="https://unpkg.com/@highlightjs/cdn-assets@11/highlight.min.js"><\/script>')</script>

<script src="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11/languages/rust.min.js"></script>

<script>(window.hljs&&!hljs.getLanguage('rust'))||document.write('<script src="https://unpkg.com/@highlightjs/cdn-assets@11/languages/rust.min.js"><\/script><script src="https://unpkg.com/@highlightjs/cdn-assets@11/languages/go.min.js"><\/script><script src="https://unpkg.com/@highlightjs/cdn-assets@11/languages/toml.min.js"><\/script><script src="https://unpkg.com/@highlightjs/cdn-assets@11/languages/bash.min.js"><\/script>')</script>

  if (typeof marked === "undefined") {
    var e = document.getElementById("cdn-error");
    if (e) e.hidden = false;
  }
