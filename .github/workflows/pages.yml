name: Deploy Pages

on:
  push:
    branches: [ main ]

# 允许该工作流把内容部署到 GitHub Pages
permissions:
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4

      # 如果你的网页需要构建（mkdocs / hugo / npm run build 等），在这里加构建步骤。
      # 当前 site/ 是纯静态文件，无需构建，直接上传即可。

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site   # 网页内容就在这里

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
